name: Build WhatsAppReport V2.0 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -not -path "./extracted/*" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found in ZIP."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Fix Android resources and JVM targets
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted")

          # Fix the background drawable reference.
          for p in root.rglob("demon_background_overlay.xml"):
              s = p.read_text()
              s = s.replace(
                  "@drawable-nodpi/demon_background",
                  "@drawable/demon_background"
              )
              p.write_text(s)
              print("Checked resource:", p)

          # Fix common Java/Kotlin JVM target settings.
          for p in list(root.rglob("build.gradle")) + list(root.rglob("build.gradle.kts")):
              s = p.read_text()
              old = s

              s = s.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )
              s = s.replace(
                  "JvmTarget.JVM_1_8",
                  "JvmTarget.JVM_17"
              )
              s = re.sub(
                  r'jvmTarget\s*=\s*["\']1\.8["\']',
                  'jvmTarget = "17"',
                  s
              )

              if s != old:
                  p.write_text(s)
                  print("Updated JVM target:", p)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppReport-v2.0-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
