name: Build APK From ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract, Fix and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found in ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix background reference
        shell: bash
        run: |
          find extracted -type f \
            -name "demon_background_overlay.xml" \
            -exec sed -i \
            's|@drawable-nodpi/demon_background|@drawable/demon_background|g' {} \;

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted")

          for p in root.rglob("build.gradle.kts"):
              text = p.read_text()
              original = text

              # Set Java compatibility to 17 where configured.
              text = re.sub(
                  r'JavaVersion\.VERSION_1_8',
                  'JavaVersion.VERSION_17',
                  text
              )

              # Set Kotlin JVM target to 17 in common Kotlin DSL syntax.
              text = re.sub(
                  r'JvmTarget\.JVM_1_8',
                  'JvmTarget.JVM_17',
                  text
              )

              # Also handle older Kotlin target syntax.
              text = re.sub(
                  r'jvmTarget\s*=\s*"1\.8"',
                  'jvmTarget = "17"',
                  text
              )

              if text != original:
                  p.write_text(text)
                  print(f"Updated JVM targets in {p}")

          for p in root.rglob("build.gradle"):
              text = p.read_text()
              original = text

              text = re.sub(
                  r'JavaVersion\.VERSION_1_8',
                  'JavaVersion.VERSION_17',
                  text
              )

              text = re.sub(
                  r'jvmTarget\s*=\s*[\'"]1\.8[\'"]',
                  'jvmTarget = "17"',
                  text
              )

              if text != original:
                  p.write_text(text)
                  print(f"Updated JVM targets in {p}")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppReport-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
