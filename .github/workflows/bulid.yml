name: Build APK From ZIP

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Extract, Fix and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extract completed."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found in ZIP."
            echo "Expected settings.gradle or settings.gradle.kts."
            find extracted -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"

      - name: Fix background resource reference
        shell: bash
        run: |
          set -e

          find extracted -type f \
            -name "demon_background_overlay.xml" \
            -print0 |
          while IFS= read -r -d '' FILE; do
            echo "Checking $FILE"

            sed -i \
              's|@drawable-nodpi/demon_background|@drawable/demon_background|g' \
              "$FILE"
          done

          echo "Background reference check completed."

      - name: Check background image
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          find app/src/main/res -type f \
            -iname "demon_background.*" -print || true

          if [ -f app/src/main/res/drawable-nodpi/demon_background.jpg ]; then
            echo "Background image found."
          elif [ -f app/src/main/res/drawable/demon_background.jpg ]; then
            echo "Background image found."
          else
            echo "WARNING: Expected background image was not found."
            echo "Build may fail if the XML references a missing image."
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppReport-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
