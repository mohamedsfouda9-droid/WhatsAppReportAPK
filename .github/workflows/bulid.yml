name: Build WhatsAppReport V2.0 APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            -not -path "./extracted/*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate project
        shell: bash
        run: |
          set -e
          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Repair app Gradle configuration
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted")
          files = list(root.glob("**/app/build.gradle.kts"))
          if not files:
              raise SystemExit("ERROR: app/build.gradle.kts not found")

          p = files[0]
          s = p.read_text()

          # Remove the invalid compatibility block added by previous workflows.
          marker = "// Automatically enforced JVM compatibility"
          if marker in s:
              s = s[:s.index(marker)].rstrip() + "\n"

          # Normalize Java 8 target declarations.
          s = s.replace(
              "JavaVersion.VERSION_1_8",
              "JavaVersion.VERSION_17"
          )

          # Remove old Kotlin JVM target lines in existing android blocks.
          s = re.sub(
              r'(?m)^[ \t]*jvmTarget\s*=\s*["\'](?:1\.8|8|17)["\'][ \t]*\n',
              '',
              s
          )

          # Add a valid top-level Android configuration block.
          s += """

          // CI compatibility: compile Java and Kotlin for JVM 17
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """

          p.write_text(s)
          print("Repaired:", p)

          # Fix the known background resource reference if present.
          for image_xml in root.rglob("demon_background_overlay.xml"):
              text = image_xml.read_text().replace(
                  "@drawable-nodpi/demon_background",
                  "@drawable/demon_background"
              )
              image_xml.write_text(text)
              print("Checked resource:", image_xml)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppReport-v2.0-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
