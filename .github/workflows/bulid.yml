name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show project files
        run: |
          echo "Repository location:"
          pwd
          echo "Files found:"
          ls -la
          echo "Searching for Gradle files:"
          find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f build.gradle.kts ] || [ -f build.gradle ]; then
            gradle assembleDebug
          else
            echo "ERROR: Gradle project files were not found in repository root."
            echo "Upload the extracted project files, not the ZIP file itself."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppReport-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
