name: Fix and Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -e
          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Fix resources and JVM targets
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("extracted")

          # Fix the invalid drawable resource reference.
          for p in root.rglob("demon_background_overlay.xml"):
              s = p.read_text()
              s = s.replace(
                  "@drawable-nodpi/demon_background",
                  "@drawable/demon_background"
              )
              p.write_text(s)
              print("Checked resource:", p)

          # Find the app module Gradle build file.
          candidates = list(root.glob("**/app/build.gradle.kts"))
          groovy = False

          if not candidates:
              candidates = list(root.glob("**/app/build.gradle"))
              groovy = True

          if not candidates:
              raise SystemExit(
                  "ERROR: app/build.gradle or app/build.gradle.kts not found."
              )

          p = candidates[0]
          s = p.read_text()

          # Normalize existing Java 8 settings.
          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = re.sub(
              r'JavaVersion\.toVersion\(["\']1\.8["\']\)',
              'JavaVersion.VERSION_17',
              s
          )

          if groovy:
              # Force Java and Kotlin to target JVM 17 in Groovy DSL.
              s += """

          // Automatically enforced JVM compatibility
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """
          else:
              # Force Java and Kotlin to target JVM 17 in Kotlin DSL.
              s += """

          // Automatically enforced JVM compatibility
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          """

          p.write_text(s)
          print("Updated JVM settings:", p)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon clean assembleDebug
          else
            gradle --no-daemon clean assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppReport-debug-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
